name: "Thunderbird"
version: "1.1.0"
slug: "thunderbird"
panel_icon: "mdi:email"
description: Docker container for Thunderbird
url: "https://github.com/mincka/ha-addons/tree/main/thunderbird"
arch:
  - aarch64
  - amd64
init: false
panel_admin: false
map:
  - share:rw
ingress: true
ingress_port: 5800
ports:
  5800/tcp: null
  5900/tcp: null
environment:
  # Thunderbird runs as the default unprivileged user (USER_ID 1000); the
  # profile remap happens at init via 89-ha-persist.sh.
  KEEP_APP_RUNNING: "1"
# Sound support (forward audio to your host), not tested
devices:
  - /dev/snd
# Map a working PulseAudio setup into the container
audio: true
image: "ghcr.io/mincka/thunderbird-{arch}"
# To pass options as environment variables (thanks to legacy mode), they must be either "int" or "str" ("str?" will be ignored).
legacy: true
options:
  VNC_PASSWORD: ""
  ENABLE_CJK_FONT: "0"
  LANG: "en_US.UTF-8"
  TZ: "Etc/UTC"
  INSTALL_PACKAGES: ""
  PACKAGES_MIRROR: ""
  CONTAINER_DEBUG: "0"
  DISPLAY_WIDTH: "1920"
  DISPLAY_HEIGHT: "1080"
  DARK_MODE: "0"
  SECURE_CONNECTION: "0"
  SECURE_CONNECTION_VNC_METHOD: "SSL"
  SECURE_CONNECTION_CERTS_CHECK_INTERVAL: "60"
  WEB_AUDIO: "1"
  WEB_HOST_CLIPBOARD_SYNC: "1"
  WEB_AUTHENTICATION: "0"
  WEB_AUTHENTICATION_ALLOW_INSECURE: "0"
  WEB_AUTHENTICATION_USERNAME: ""
  WEB_AUTHENTICATION_PASSWORD: ""
  WEB_FILE_MANAGER: "0"
  WEB_FILE_MANAGER_ALLOWED_PATHS: "AUTO"
  WEB_FILE_MANAGER_DENIED_PATHS: ""
  WEB_NOTIFICATION: "0"
  WEB_TERMINAL: "0"
  WEB_TERMINAL_SHELL_PATH: "/bin/sh"
  WEB_AUTHENTICATION_TOKEN_VALIDITY_TIME: "24"
schema:
  VNC_PASSWORD: str
  ENABLE_CJK_FONT: str
  LANG: str
  TZ: str
  INSTALL_PACKAGES: str
  PACKAGES_MIRROR: str
  CONTAINER_DEBUG: str
  DISPLAY_WIDTH: str
  DISPLAY_HEIGHT: str
  DARK_MODE: str
  SECURE_CONNECTION: str
  SECURE_CONNECTION_VNC_METHOD: str
  SECURE_CONNECTION_CERTS_CHECK_INTERVAL: str
  WEB_AUDIO: str
  WEB_HOST_CLIPBOARD_SYNC: str
  WEB_AUTHENTICATION: str
  WEB_AUTHENTICATION_ALLOW_INSECURE: str
  WEB_AUTHENTICATION_USERNAME: str
  WEB_AUTHENTICATION_PASSWORD: str
  WEB_FILE_MANAGER: str
  WEB_FILE_MANAGER_ALLOWED_PATHS: str
  WEB_FILE_MANAGER_DENIED_PATHS: str
  WEB_NOTIFICATION: str
  WEB_TERMINAL: str
  WEB_TERMINAL_SHELL_PATH: str
  WEB_AUTHENTICATION_TOKEN_VALIDITY_TIME: str
