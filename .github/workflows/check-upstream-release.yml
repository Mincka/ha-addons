name: Check Upstream Releases

# One workflow for every add-on that tracks a jlesage/docker-* image, so all
# update PRs follow the same format. Claude only adds new options (config.yaml
# + translations); .github/scripts/upstream_sync.py generates everything else
# (Dockerfile tag, version bump, CHANGELOG entry, PR body) and fails if Claude
# touched anything outside that scope.

on:
  schedule:
    - cron: '47 4 * * *'  # Daily at 4:47 AM UTC (off-peak minute to reduce scheduling delay)
  workflow_dispatch:
    inputs:
      addon:
        description: Add-on to check
        type: choice
        options: [all, firefox, chromium, thunderbird]
        default: all
      dry_run:
        description: Generate the update and show the diff, without pushing or opening a PR
        type: boolean
        default: false

jobs:
  update:
    name: ${{ matrix.addon }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    strategy:
      fail-fast: false
      # Sequential, so a later add-on sees the options an earlier one just added
      # on its update branch and reuses the same default and wording.
      max-parallel: 1
      matrix:
        include:
          - addon: firefox
            extra: firefox_edge
            app: Firefox
            upstream: jlesage/docker-firefox
            app_vars: the FF_* variables (FF_OPEN_URL, FF_KIOSK, FF_CUSTOM_ARGS)
          - addon: chromium
            extra: ''
            app: Chromium
            upstream: jlesage/docker-chromium
            app_vars: the CHROMIUM_* variables (CHROMIUM_APP_URL, CHROMIUM_CUSTOM_ARGS, CHROMIUM_REMOTE_DEBUGGING, CHROMIUM_REMOTE_DEBUGGING_PORT)
          - addon: thunderbird
            extra: ''
            app: Thunderbird
            upstream: jlesage/docker-thunderbird
            app_vars: no app-specific variables
    concurrency:
      group: upstream-${{ matrix.addon }}
      cancel-in-progress: false
    env:
      ADDON: ${{ matrix.addon }}
      EXTRA: ${{ matrix.extra }}
      APP: ${{ matrix.app }}
      UPSTREAM: ${{ matrix.upstream }}
      VERSION_FILE: .upstream-version-${{ matrix.addon }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Select add-on
        id: select
        env:
          SELECTED: ${{ inputs.addon || 'all' }}
        run: |
          if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "$ADDON" ]; then
            echo "Skipping $ADDON (only $SELECTED was requested)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "::error::A real run must start from the default branch; use dry_run on other branches."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.select.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check for new upstream release
        id: check
        if: steps.select.outputs.enabled == 'true'
        run: |
          LATEST=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name')
          TRACKED=$(cat "$VERSION_FILE" 2>/dev/null || echo "none")
          TITLE="🔄 Update to $UPSTREAM $LATEST"
          echo "Latest upstream: $LATEST / tracked: $TRACKED"
          {
            echo "latest=$LATEST"
            echo "tracked=$TRACKED"
            echo "title=$TITLE"
            echo "branch=update-upstream-$ADDON-$LATEST"
          } >> "$GITHUB_OUTPUT"

          if [ "$LATEST" = "$TRACKED" ]; then
            echo "✅ Already up to date"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PRs are matched by title, so older branch names still count.
          PRS=$(gh pr list --state all --limit 200 --json number,title,state,mergedAt)
          OPEN=$(jq -r --arg t "$TITLE" '[.[] | select(.title == $t and .state == "OPEN")][0].number // empty' <<<"$PRS")
          SKIPPED=$(jq -r --arg t "$TITLE" '[.[] | select(.title == $t and .state == "CLOSED" and .mergedAt == null)][0].number // empty' <<<"$PRS")
          if [ "$DRY_RUN" = "true" ]; then
            echo "🧪 Dry run: generating the update for $LATEST (existing PRs: ${OPEN:-none} open, ${SKIPPED:-none} skipped)"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$OPEN" ]; then
            echo "PR #$OPEN is already open for $LATEST"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$SKIPPED" ]; then
            echo "PR #$SKIPPED was closed without merge: skipping $LATEST"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 New release to integrate"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare branch and context
        id: prepare
        if: steps.check.outputs.should_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.check.outputs.branch }}"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # Options from other add-ons, including their open update branches.
          git fetch --quiet origin '+refs/heads/update-upstream-*:refs/remotes/origin/update-upstream-*' || true
          {
            echo "known<<KNOWN_EOF"
            python3 .github/scripts/upstream_sync.py known-options --addon "$ADDON"
            echo "KNOWN_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$EXTRA" ]; then
            echo "folders=\`$ADDON/\` and \`$EXTRA/\` (apply identical changes to both)" >> "$GITHUB_OUTPUT"
          else
            echo "folders=\`$ADDON/\`" >> "$GITHUB_OUTPUT"
          fi

      - name: Add new upstream options (Claude)
        if: steps.check.outputs.should_update == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_args: |
            --allowedTools "Read,Edit,Glob,Grep,WebFetch"
          prompt: |
            ${{ matrix.upstream }} released ${{ steps.check.outputs.latest }} (this repository tracks ${{ steps.check.outputs.tracked }}).
            Add-on folder(s): ${{ steps.prepare.outputs.folders }}.

            Your ONLY task: expose in the add-on the environment variables that upstream introduced since ${{ steps.check.outputs.tracked }}.
            A script runs after you and generates the Dockerfile tag, version bump, CHANGELOG entry and PR body.
            It fails the run if you change any file other than config.yaml and translations/en.yaml in the folder(s) above.
            Do NOT edit CHANGELOG.md, Dockerfile, the `version` field or .upstream-version-* files, and do NOT commit.

            1. Read the upstream release notes newer than ${{ steps.check.outputs.tracked }} (https://api.github.com/repos/${{ matrix.upstream }}/releases?per_page=20)
               and the "Environment Variables" table of https://raw.githubusercontent.com/${{ matrix.upstream }}/master/README.md.
            2. Compare with the `options:` block of ${{ matrix.addon }}/config.yaml. This add-on exposes ${{ matrix.app_vars }}
               plus the shared baseimage variables. Only consider variables introduced by those new releases: older upstream
               variables that are absent from config.yaml were left out on purpose.
            3. For each new variable that makes sense for Home Assistant users:
               - config.yaml: add it to `options` (upstream default, as a quoted string) and to `schema` (`str`), right after
                 the most closely related existing option, at the same position in both blocks.
               - translations/en.yaml: add `name` and `description` right after the same related option.
               - If the variable is listed under "Options already defined in other add-ons" below, copy its default, schema,
                 name and description EXACTLY, so every add-on uses the same wording.
               - Otherwise follow the style of the existing descriptions: for a 0/1 flag start with "When set to 1, ...".
                 The first sentence must say what the option does (it is copied into the CHANGELOG), then requirements
                 (e.g. secure connection), then limitations (VNC clients, HA Ingress) when they apply.
            4. If there is nothing new, change nothing.

            Finish with a short summary of the options you added, or say that there were none.

            ## Options already defined in other add-ons but missing here

            ${{ steps.prepare.outputs.known }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the update
        if: steps.check.outputs.should_update == 'true'
        run: |
          EXTRA_ARGS=()
          [ -n "$EXTRA" ] && EXTRA_ARGS=(--extra "$EXTRA")
          python3 .github/scripts/upstream_sync.py apply \
            --addon "$ADDON" "${EXTRA_ARGS[@]}" \
            --app "$APP" \
            --repo "$UPSTREAM" \
            --tracked "${{ steps.check.outputs.tracked }}" \
            --latest "${{ steps.check.outputs.latest }}" \
            --version-file "$VERSION_FILE" \
            --base-sha "${{ steps.prepare.outputs.base_sha }}" \
            --out-dir "$RUNNER_TEMP/upstream-sync"

          {
            echo "## $ADDON: ${{ steps.check.outputs.tracked }} → ${{ steps.check.outputs.latest }}"
            echo
            cat "$RUNNER_TEMP/upstream-sync/pr-body.md"
            echo
            echo '<details><summary>Diff</summary>'
            echo
            echo '```diff'
            git diff
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, push and open the PR
        if: steps.check.outputs.should_update == 'true' && env.DRY_RUN != 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
          BRANCH: ${{ steps.check.outputs.branch }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          git add -A
          git commit -m "chore: update to upstream ${UPSTREAM#*/} $LATEST"
          # The branch only belongs to this workflow and has no open PR (checked above).
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr create --title "$TITLE" --body-file "$RUNNER_TEMP/upstream-sync/pr-body.md" \
            --base "${{ github.event.repository.default_branch }}" --head "$BRANCH")
          PR_NUMBER=${PR_URL##*/}
          echo "Created PR #$PR_NUMBER"

          # Close older update PRs for the same upstream: this one includes their releases.
          gh pr list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title | startswith(\"🔄 Update to $UPSTREAM \")) | select(.number != $PR_NUMBER) | .number" |
          while read -r OLD; do
            gh pr close "$OLD" --comment "Superseded by #$PR_NUMBER ($UPSTREAM $LATEST), which includes this release."
          done
